name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # 历史遗留 lint 问题较多，暂设为非阻断；后续单独治理后再改为阻断
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.1"

      - name: Run ruff check
        run: ruff check src tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umcp
          POSTGRES_PASSWORD: umcp
          POSTGRES_DB: umcp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      UMCP_JWT_SECRET: ci-test-secret-32bytes-padding
      TEST_DATABASE_URL: postgresql://umcp:umcp@localhost:5432/umcp_dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --tb=short -q

  manifest:
    name: Deploy manifest check
    runs-on: ubuntu-latest
    # 清单漏项会导致服务器发布缺文件，先以告警形式暴露，不阻断合并
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check sync manifest covers changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE_SHA"
          else
            BASE="HEAD~1"
          fi
          python3 scripts/check_sync_manifest.py --base "$BASE" --head HEAD

  build:
    name: Build (docker)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: docker build -t umcp-core:ci .
