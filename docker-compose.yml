services:
  postgres:
    image: postgres:16-alpine
    container_name: umcp_postgres
    environment:
      POSTGRES_USER: umcp
      POSTGRES_PASSWORD: umcp
      POSTGRES_DB: umcp_dev
    ports:
      - "5432:5432"
    volumes:
      - umcp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umcp"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: umcp_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UMCP_JWT_SECRET: ${UMCP_JWT_SECRET:-dev-secret-change-me-32bytes}
      UMCP_DB_DSN: postgresql+psycopg://umcp:umcp@postgres:5432/umcp_dev
      UMCP_HOST: 0.0.0.0
      UMCP_PORT: 8000
      UMCP_LOG_LEVEL: INFO
      UMCP_AUTH_CACHE_TTL: ${UMCP_AUTH_CACHE_TTL:-60}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  umcp_pg_data:
