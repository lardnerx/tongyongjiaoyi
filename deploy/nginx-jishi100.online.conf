# =============================================================================
# UMCP jishi100.online Nginx 配置（已替换好域名）
# 直接复制到: /etc/nginx/sites-available/jishi100.online
# =============================================================================

upstream umcp_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name jishi100.online;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name jishi100.online;

    # SSL 证书（由 certbot 自动填充）
    ssl_certificate     /etc/letsencrypt/live/jishi100.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jishi100.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 日志
    access_log /var/log/nginx/jishi100_access.log;
    error_log  /var/log/nginx/jishi100_error.log;

    # 请求大小限制（微信支付回调可能需要较大 body）
    client_max_body_size 10m;

    location / {
        proxy_pass http://umcp_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 健康检查端点无需缓存
    location /api/v1/health {
        proxy_pass http://umcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Prometheus 指标端点（可限制访问 IP）
    location /metrics {
        # allow 你的监控服务器 IP;
        deny all;
        return 403;
    }
}
